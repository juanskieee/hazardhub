<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hazard Hub - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold:       #E3AB00;
      --gold-dark:  #C99600;
      --gold-panel: #F2CE5A;
      --card-bg:    #DCA900;
      --text-dark:  #2a1f00;
      --text-muted: #7a6010;
      --white:      #ffffff;
    }
    body {
      font-family: 'Nunito', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .bar { width: 100%; height: 40px; background: var(--gold); flex-shrink: 0; }
    .spacer { flex: 1; display: flex; align-items: center; justify-content: center; }

    .card {
      background: var(--card-bg);
      border-radius: 26px;
      padding: 36px 32px 40px;
      width: 360px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.28);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeUp .55s cubic-bezier(.22,.68,0,1.2) both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(28px) scale(.97); }
      to   { opacity:1; transform:none; }
    }
    .logo-wrap { width: 120px; height: 120px; margin-bottom: 12px; }
    .logo-wrap svg { width: 100%; height: 100%; }

    .title { font-size: 2.5rem; color: var(--white); margin-bottom: 22px; text-align: center; }
    .title strong { font-weight: 900; }

    .form-panel {
      background: var(--gold-panel);
      border-radius: 20px;
      padding: 24px 24px 30px;
      width: 100%;
    }
    .field { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 7px;
      padding-left: 4px;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 12px 20px;
      border-radius: 50px;
      border: none;
      background: var(--white);
      font-size: 1rem;
      font-family: 'Nunito', sans-serif;
      color: var(--text-dark);
      outline: none;
      transition: box-shadow .2s;
    }
    input:focus { box-shadow: 0 0 0 3px rgba(227,171,0,.55); }

    .role-row { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; margin-top: 4px; }
    .role-row label { margin-bottom: 0; white-space: nowrap; }
    .select-wrap { position: relative; display: inline-block; }
    select {
      appearance: none;
      background: var(--white);
      border: none;
      border-radius: 50px;
      padding: 9px 44px 9px 20px;
      font-size: 1.05rem;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      color: var(--text-dark);
      cursor: pointer;
      outline: none;
    }
    .select-wrap::after {
      content: '';
      position: absolute;
      right: 16px; top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-top: 7px solid var(--text-dark);
    }

    .msg {
      text-align: center;
      font-size: .88rem;
      font-weight: 700;
      border-radius: 12px;
      padding: 9px 14px;
      margin-bottom: 14px;
      display: none;
    }
    .msg.error   { background: #fff0f0; color: #c0392b; display: block; }
    .msg.success { background: #f0fff4; color: #1a7a3c; display: block; }

    .btn-login {
      display: block;
      margin: 0 auto;
      background: var(--gold);
      color: var(--white);
      border: none;
      border-radius: 50px;
      padding: 14px 52px;
      font-family: 'Nunito', sans-serif;
      font-size: .9rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 14px rgba(0,0,0,.2);
    }
    .btn-login:hover    { background: var(--gold-dark); transform: translateY(-2px); }
    .btn-login:active   { transform: translateY(0); }
    .btn-login:disabled { opacity: .65; cursor: not-allowed; transform: none; }

    @keyframes shake {
      0%,100%{transform:translateX(0)}
      25%{transform:translateX(-6px)}
      75%{transform:translateX(6px)}
    }
  </style>
</head>
<body>
  <div class="bar"></div>
  <div class="spacer">
    <div class="card">
      <div class="logo-wrap">
        <svg viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="70" cy="70" r="62" stroke="#1a1000" stroke-width="3.5" fill="none" stroke-dasharray="8 4"/>
          <path d="M118 34 l6-6 l2 8 l-8 2z" fill="#1a1000"/>
          <path d="M22 106 l-6 6 l-2-8 l8-2z" fill="#1a1000"/>
          <path d="M45 72 Q45 50 70 48 Q95 50 95 72 Z" fill="none" stroke="#1a1000" stroke-width="3" stroke-linejoin="round"/>
          <rect x="38" y="72" width="64" height="7" rx="3.5" fill="none" stroke="#1a1000" stroke-width="3"/>
          <line x1="70" y1="48" x2="70" y2="62" stroke="#1a1000" stroke-width="3"/>
          <path d="M70 84 L57 104 L83 104 Z" fill="none" stroke="#1a1000" stroke-width="3" stroke-linejoin="round"/>
          <line x1="70" y1="90" x2="70" y2="98" stroke="#1a1000" stroke-width="3" stroke-linecap="round"/>
          <circle cx="70" cy="101.5" r="1.8" fill="#1a1000"/>
        </svg>
      </div>

      <h1 class="title"><strong>Hazard</strong> Hub</h1>

      <div class="form-panel">
        <div id="msg" class="msg"></div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email"/>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password"/>
        </div>
        <input type="hidden" id="role" value="Admin"/>

        <button class="btn-login" id="loginBtn" onclick="handleLogin()">Login</button>
      </div>
    </div>
  </div>
  <div class="bar"></div>

  <script>
    const msgEl = document.getElementById('msg');
    const btn   = document.getElementById('loginBtn');

    function showMsg(text, type) {
      msgEl.textContent = text;
      msgEl.className   = 'msg ' + type;
    }

    function shake() {
      btn.style.animation = 'none';
      requestAnimationFrame(() => { btn.style.animation = 'shake .3s ease'; });
    }

    async function handleLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role     = document.getElementById('role').value;

      if (!email || !password) {
        showMsg('Please enter your email and password.', 'error');
        shake();
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Logging in...';
      msgEl.className = 'msg';

      try {
        const res  = await fetch('/api/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, password, role }),
        });
        const data = await res.json();

        if (res.ok) {
          showMsg('Welcome, ' + (data.user.full_name || data.user.email) + '!', 'success');
          btn.textContent = 'Success';
          setTimeout(() => { window.location.replace(data.redirect_url || '/dashboard'); }, 900);
        } else {
          showMsg(data.error || 'Login failed.', 'error');
          shake();
          btn.disabled    = false;
          btn.textContent = 'Login';
        }
      } catch (err) {
        showMsg('Cannot reach server. Is the backend running?', 'error');
        shake();
        btn.disabled    = false;
        btn.textContent = 'Login';
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
  </script>
</body>
</html>
